<style>
/* Layout: one calm mobile column. Night-blue brand, one luminous-blue action, gold only as a hairline accent. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#0b1630; --muted:#4a5875; --line:#dde4ef;
  --night:#0b1630; --action:#2f7cf6; --action-ink:#ffffff; --action-soft:#e8f0fe; --gold:#b8892f;
  --ok:#2d7a4f; --warn:#a8670f; --danger:#b23a2a; --ok-soft:#e7f4ec; --warn-soft:#fbf1e1; --danger-soft:#fbe9e6;
  --shadow:0 1px 2px rgba(11,22,48,.05),0 8px 24px rgba(11,22,48,.06);
  --chip:#0b1630; --chip-ink:#ffffff;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0a1224; --surface:#121d36; --ink:#eef2fa; --muted:#a9b6cf; --line:#24314f;
  --night:#060c1a; --action:#5aa8ff; --action-ink:#06101f; --action-soft:#16284a; --gold:#d6a84e;
  --ok:#6fcf97; --warn:#f0b75a; --danger:#ff8a78; --ok-soft:#12301f; --warn-soft:#33260f; --danger-soft:#3a1a16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --chip:#5aa8ff; --chip-ink:#06101f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0a1224; --surface:#121d36; --ink:#eef2fa; --muted:#a9b6cf; --line:#24314f;
  --night:#060c1a; --action:#5aa8ff; --action-ink:#06101f; --action-soft:#16284a; --gold:#d6a84e;
  --ok:#6fcf97; --warn:#f0b75a; --danger:#ff8a78; --ok-soft:#12301f; --warn-soft:#33260f; --danger-soft:#3a1a16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --chip:#5aa8ff; --chip-ink:#06101f; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px}
.wrap{max-width:600px;margin:0 auto;display:grid;gap:22px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:700 1.15rem var(--f-display);letter-spacing:-.01em}
.brand svg{width:40px;height:40px;border-radius:11px;flex:none}
.brand b{color:var(--action);font-weight:700}
.langs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{font:600 .85rem var(--f-body);border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer;min-height:40px}
.langs button[aria-pressed="true"]{background:var(--chip);color:var(--chip-ink)}
.hero{display:grid;gap:12px;padding-top:8px}
.hero h1{font:700 clamp(2rem,8vw,2.6rem)/1.08 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.hero h1::after{content:"";display:block;width:56px;height:3px;border-radius:2px;background:var(--gold);margin-top:14px}
.hero p{margin:0;color:var(--muted);max-width:52ch}
.primary{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:64px;font:700 1.15rem var(--f-body);
  background:var(--action);color:var(--action-ink);border:0;border-radius:18px;cursor:pointer;box-shadow:var(--shadow);text-align:center}
.primary svg{width:26px;height:26px;flex:none}
.primary:active{transform:scale(.99)}
.primary[aria-disabled="true"]{opacity:.6;pointer-events:none}
.hide-input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.secondary{font:600 1rem var(--f-body);background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:14px;min-height:52px;padding:10px 16px;cursor:pointer;width:100%}
.quiet{font:600 .95rem var(--f-body);background:transparent;color:var(--muted);border:0;min-height:44px;padding:8px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,label:focus-within,textarea:focus-visible{outline:3px solid var(--action);outline-offset:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:12px;box-shadow:var(--shadow);min-width:0}
.more{display:grid;gap:14px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;display:grid;gap:4px}
.drop.over{border-color:var(--action);color:var(--ink);background:var(--action-soft)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:76px;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.pg{position:relative}.pg b{position:absolute;left:5px;bottom:5px;background:var(--action);color:#fff;font-size:.8rem;border-radius:999px;padding:1px 8px}
.pg button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:#b23a2a;color:#fff;font-size:16px;line-height:1;cursor:pointer}
.addpg{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border:2px dashed var(--action);border-radius:14px;color:var(--action);font-weight:700;font-size:1.02rem;cursor:pointer;background:transparent}
.pagesinfo{font-weight:700;margin:0}
.tin{width:100%;box-sizing:border-box;min-height:50px;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.tester{border-color:var(--action);background:linear-gradient(var(--action-soft),var(--surface))}
textarea{width:100%;min-height:110px;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}
label.t{font-weight:600;font-size:.95rem}
.status{font-size:.95rem;color:var(--muted);min-height:1.5em;text-align:center}
.loading{display:flex;align-items:center;gap:14px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--action);flex:none}
@media (prefers-reduced-motion:no-preference){
  .dot{animation:breathe 1.8s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1);opacity:1}}
  .results>*{animation:rise .35s ease-out both}
  .results>*:nth-child(2){animation-delay:.05s}.results>*:nth-child(3){animation-delay:.1s}.results>*:nth-child(4){animation-delay:.15s}.results>*:nth-child(5){animation-delay:.2s}.results>*:nth-child(6){animation-delay:.25s}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
.results{display:grid;gap:14px}
.kicker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--action-soft);color:var(--action);font-size:.8rem;letter-spacing:0}
.example{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.72rem}
.card h2{font:700 1.3rem/1.3 var(--f-display);margin:0;text-wrap:balance}
.from{color:var(--muted);font-size:.95rem}
.facts{display:flex;gap:18px;flex-wrap:wrap;font-size:.95rem}
.facts span{color:var(--muted)}
.facts strong{font-variant-numeric:tabular-nums}
.urgency{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 14px;font-weight:700;font-size:1.1rem}
.urgency svg{width:28px;height:28px;flex:none}
.u-alta{background:var(--danger-soft);color:var(--danger)}
.u-media{background:var(--warn-soft);color:var(--warn)}
.u-baja{background:var(--ok-soft);color:var(--ok)}
.reason{margin:0;color:var(--ink)}
.big{font:700 1.25rem/1.35 var(--f-display);margin:0;font-variant-numeric:tabular-nums}
.note{margin:0;color:var(--muted);font-size:.95rem}
ol.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:s}
ol.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;counter-increment:s}
ol.steps li::before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--chip);color:var(--chip-ink);font-weight:700;font-size:.95rem}
dl.words{margin:0;display:grid;gap:10px}
dl.words dt{font-weight:700}
dl.words dd{margin:0;color:var(--muted)}
ul.plain{margin:0;padding-left:1.2em;display:grid;gap:6px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.privacy summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.privacy p{margin:0 0 8px;color:var(--muted);font-size:.95rem}
.fine{font-size:.85rem;color:var(--muted);text-align:center;margin:0}
</style>

let lang = "es", files = [], ctl = null, sample = null, last = null, booted = false, maxImages = 8, showAsk = false;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arr = v => Array.isArray(v) ? v.filter(Boolean) : [];

function render(){
  const t = T[lang];

  const u = ["alta","media","baja"].includes(r.urgencia) ? r.urgencia : "media";

  const facts = [r.importe && `<div><span>${t.amount}</span> <strong>${esc(r.importe)}</strong></div>`, r.referencia && `<div><span>${t.reference}</span> <strong>${esc(r.referencia)}</strong></div>`].filter(Boolean).join("");
  const steps = arr(r.que_hacer), words = arr(r.glosario), missing = arr(r.falta), qs = arr(r.preguntas);
  let n = 0; const k = (label) => `<div class="kicker"><span class="num">${++n}</span>${label}${n===1?ex:""}</div>`;
  $("#results").innerHTML = `
    <article class="card" id="c-meaning">${k(t.k1)}
      <div class="from">${esc(r.emisor)}${r.tipo ? " · " + esc(r.tipo) : ""}</div>
      <h2>${esc(r.resumen)}</h2>

    </article>
    <article class="card" id="c-urgent">${k(t.k2)}

      ${r.motivo_urgencia ? `<p class="reason">${esc(r.motivo_urgencia)}</p>` : ""}

    </article>
    ${steps.length ? `<article class="card" id="c-steps">${k(t.k4)}<ol class="steps">${steps.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ol></article>` : ""}
    ${words.length ? `<article class="card" id="c-words">${k(t.k5)}<dl class="words">${words.map(w=>`<div><dt>${esc(w.termino)}</dt><dd>${esc(w.explicacion)}</dd></div>`).join("")}</dl></article>` : ""}
    ${missing.length ? `<article class="card" id="c-missing">${k(t.k6)}<ul class="plain">${missing.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></article>` : ""}
    <div class="actions">
      <button class="secondary" type="button" id="copyBtn">${t.copy}</button>
      ${qs.length ? `<button class="secondary" type="button" id="askBtn" aria-expanded="${showAsk}">${t.ask}</button>` : ""}
    </div>
    ${qs.length && showAsk ? `<article class="card" id="c-questions"><div class="kicker">${t.askTitle}</div><ol class="steps">${qs.map(q=>`<li><span>${esc(q)}</span></li>`).join("")}</ol></article>` : ""}
  `;

}

function summaryText(){
  const t = T[lang], r = last || t.ex, u = ["alta","media","baja"].includes(r.urgencia) ? r.urgencia : "media";
  const lines = [t.copyHead, "", `${t.k1}: ${r.resumen}`, `${r.emisor || ""}${r.tipo ? " · " + r.tipo : ""}`, `${t.k2}: ${t.urg[u]}${r.motivo_urgencia ? " — " + r.motivo_urgencia : ""}`, `${t.k3}: ${r.plazo || t.noDeadline}`];
  if (r.importe) lines.push(`${t.amount}: ${r.importe}`);
  if (r.referencia) lines.push(`${t.reference}: ${r.referencia}`);
  const steps = arr(r.que_hacer); if (steps.length) { lines.push("", t.k4 + ":"); steps.forEach((s,i)=>lines.push(`${i+1}. ${s}`)); }
  const qs = arr(r.preguntas); if (qs.length) { lines.push("", t.askTitle + ":"); qs.forEach((q,i)=>lines.push(`${i+1}. ${q}`)); }
  return lines.join("\n");
}

async function pdfToImages(file){
  const lib = window.pdfjsLib; if (!lib) return [];
  const pdf = await lib.getDocument({data: await file.arrayBuffer()}).promise;
  const out = [];
  for (let p = 1; p <= Math.min(pdf.numPages, maxImages); p++){
    const page = await pdf.getPage(p), vp = page.getViewport({scale: 2});
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    await page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
    out.push(await new Promise(r => c.toBlob(r, "image/jpeg", 0.85)));
  }
  return out;
}
function addText(s){ const ta = $("#text"); ta.value = (ta.value ? ta.value + "\n\n" : "") + String(s || "").trim(); }
async function addFiles(list){
  const t = T[lang]; const imgs = [];
  for (const f of [...list]){
    if (f.type === "application/pdf" || /\.pdf$/i.test(f.name || "")){
      $("#status").textContent = t.pdfReading;
      try { imgs.push(...await pdfToImages(f)); } catch { $("#status").textContent = t.failed; }
    } else if (/^image\//.test(f.type)) imgs.push(f);
    else if (/\.docx$/i.test(f.name || "") && window.mammoth){
      try { const r = await mammoth.extractRawText({arrayBuffer: await f.arrayBuffer()}); addText(r.value); } catch { $("#status").textContent = t.failed; }
    } else if (f.type === "text/plain" || /\.txt$/i.test(f.name || "")) addText(await f.text());
  }
  const all = [...files, ...imgs];
  files = all.slice(0, maxImages);
  $("#status").textContent = all.length > maxImages ? t.tooMany.replace("{n}", maxImages) : "";
  renderPages();
}
function renderPages(){
  const t = T[lang], n = files.length;
  $("#thumbs").innerHTML = "";
  files.forEach((f, k) => {
    const d = document.createElement("div"); d.className = "pg";
    const i = new Image(); i.alt = t.thumbAlt + " " + (k+1); i.src = URL.createObjectURL(f);
    const b = document.createElement("b"); b.textContent = k+1;
    const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", t.removePage + " " + (k+1));
    x.onclick = () => { files.splice(k, 1); renderPages(); };
    d.append(i, b, x); $("#thumbs").append(d);
  });
  $("#pagesInfo").hidden = !n; $("#pagesInfo").textContent = t.pagesN.replace("{n}", n);
  $("#addPage").hidden = !n || n >= maxImages;
  $("#drop").hidden = !!n;
  $("#go").textContent = n ? t.goN.replace("{n}", n) : t.go;
}

function prompt(text){
  return `You are a careful administrative expert who explains official letters to ordinary people, including older people and people living abroad, in a calm, kind tone. The letter can come from any country (for example Spain, Germany, Austria, Switzerland or the UK) and can be written in any language. First work out which country and which authority or company sent it, and explain it according to the rules and procedures of THAT country (for example, a German Finanzamt letter follows German rules, not Spanish ones). If it is not an official letter but an important private one (bank, insurer, landlord, employer, utility), explain it the same way.
Read the letter (in the images and/or the text) and reply with ONLY one JSON object. Write every value entirely in ${T[lang].langName}, in short, plain sentences a native speaker would use. Keep official terms in the original language (such as "requerimiento", "Cl@ve", "Bescheid" or "Widerspruch") as they are and explain them in the glossary. In "emisor", name the sender and its country.
Shape:
{"emisor": string, "tipo": string, "resumen": string (1-2 clear sentences saying what the letter means for the reader), "urgencia": "alta"|"media"|"baja", "motivo_urgencia": string (one sentence: why), "plazo": string (the deadline and from when it counts, ONLY if the letter states it clearly; otherwise ""), "importe": string (only if stated, else ""), "referencia": string (case number or ""), "que_hacer": [string] (concrete numbered steps, max 5), "glosario": [{"termino": string, "explicacion": string}] (max 4, everyday words), "falta": [string] (information that is missing, unreadable or uncertain and that matters, e.g. the date of receipt; [] if none), "preguntas": [string] (3-5 questions the reader should ask a gestor or lawyer about this letter)}
Never invent deadlines, amounts or obligations. If you are not sure, leave the field empty and say what is missing in "falta". Keep the JSON keys and the "urgencia" values exactly as shown. If it does not look like an official letter, say so in "resumen".
${text ? "Letter text:\n" + text.slice(0, 20000) : ""}`;
}

const API = "https://carta-clara-api.villaflordeloto9.workers.dev/explain";
function deviceId(){ let id=null; try{ id=localStorage.getItem("cc-device"); }catch{} if(!id){ id="web-"+Date.now().toString(36)+Math.random().toString(36).slice(2,10); try{ localStorage.setItem("cc-device",id); }catch{} } return id; }
function toJpeg64(file){ return new Promise((ok,ko)=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,1600/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height); ok(c.toDataURL("image/jpeg",0.75).split(",")[1]); URL.revokeObjectURL(img.src); }; img.onerror=ko; img.src=URL.createObjectURL(file); }); }
async function explain(){
  const t = T[lang], text = $("#text").value.trim();
  if (!files.length && !text){ $("#status").textContent = t.needInput; return; }
  ctl = new AbortController();
  $("#primary").setAttribute("aria-disabled","true"); $("#go").disabled = true;
  $("#loading").hidden = false; $("#status").textContent = "";
  $("#loading").scrollIntoView({behavior:"smooth", block:"center"});
  try {
    const images = await Promise.all(files.map(toJpeg64));
    const res = await fetch(API, { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({lang, images, text, deviceId: deviceId()}), signal: ctl.signal });
    if (res.status === 429) throw {code:"rate_limited"};
    if (!res.ok) throw {code:"failed"};
    const r = await res.json();
    if (!r || typeof r !== "object" || !r.resumen) throw {code:"invalid_json"};
    last = r; showAsk = false; render();
    $("#results").scrollIntoView({behavior:"smooth", block:"start"});
  } catch(e){
    $("#status").textContent = (e && e.name === "AbortError") ? "" : (t.err[e.code] || t.failed);
  } finally {
    $("#loading").hidden = true; $("#primary").removeAttribute("aria-disabled"); $("#go").disabled = false;
  }
}
$("#go").addEventListener("click", explain);
$("#stop").addEventListener("click", () => ctl?.abort());
$("#clear").addEventListener("click", () => {

});
